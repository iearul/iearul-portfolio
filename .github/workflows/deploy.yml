name: Deploy to iearul.xyz

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_PORT: '65002'
      REMOTE_DIR: domains/iearul.xyz/public_html
    steps:
      - name: Check deploy secrets
        env:
          HAS_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' && secrets.SSH_KNOWN_HOSTS != '' && secrets.SSH_HOST != '' && secrets.SSH_USER != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::Set SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS, SSH_HOST and SSH_USER in the repository secrets (see README)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_BASE: https://admin.iearul.xyz/api/portfolio

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload with rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes"
          DEST="$SSH_USER@$SSH_HOST:$REMOTE_DIR"
          # 1. New content-hashed assets first, so the old index.html keeps working meanwhile.
          rsync -rlptz -e "$SSH" dist/assets/ "$DEST/assets/"
          # 2. Top-level files. Never use --delete here: the same docroot also holds
          #    the admin, lgc, megashop and iloveyou apps.
          rsync -rlptz -e "$SSH" --exclude 'assets/' dist/ "$DEST/"
          # 3. Prune assets the new build no longer references.
          rsync -rlptz --delete -e "$SSH" dist/assets/ "$DEST/assets/"

      - name: Smoke test
        run: |
          curl -fsS https://iearul.xyz/ | grep -q 'Career Island'
          curl -fsS -o /dev/null https://iearul.xyz/cv
